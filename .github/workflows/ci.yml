name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same PR — saves free-tier Actions minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit & integration tests (pytest)
        run: pytest -v

  dependency-scan:
    name: Scan dependencies for known CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (requirements.txt)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/requirements.txt
          severity: CRITICAL,HIGH
          exit-code: "1" # fail the PR check if a critical/high CVE is found

  notify-on-failure:
    name: Notify on failure
    needs: [test, dependency-scan]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack webhook notification
        if: ${{ vars.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: CI failed on PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}\n${{ github.event.pull_request.html_url }}\"}" \
            "${{ vars.SLACK_WEBHOOK_URL }}"
